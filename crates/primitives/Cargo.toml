[package]
name = "sbv-primitives"
homepage = "https://github.com/scroll-tech/stateless-block-verifier/tree/master/crates/primitives"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rkyv = { workspace = true, optional = true }
serde.workspace = true
tracing = { workspace = true, optional = true }

alloy-consensus = { workspace = true, features = ["serde", "serde-bincode-compat"] }
alloy-eips.workspace = true
alloy-evm = { workspace = true, optional = true }
alloy-network = { workspace = true, optional = true }
alloy-rpc-types-eth.workspace = true
alloy-rpc-types-debug.workspace = true
alloy-serde.workspace = true
alloy-primitives.workspace = true

revm = { workspace = true, optional = true }
revm-scroll = { workspace = true, optional = true }
reth-chainspec = { workspace = true, optional = true }
reth-evm = { workspace = true, optional = true }
reth-evm-ethereum = { workspace = true, optional = true }
reth-ethereum-forks = { workspace = true, optional = true }
reth-execution-types = { workspace = true, optional = true }
reth-ethereum-primitives = { workspace = true, features = ["serde"] }
reth-primitives-traits = { workspace = true, features = ["serde"] }
dogeos-chainspec = { workspace = true, optional = true }
dogeos-hardforks = { workspace = true, optional = true }
dogeos-protocol-types = { workspace = true, optional = true }
dogeos-reth-evm = { workspace = true, optional = true }
dogeos-reth-primitives = { workspace = true, optional = true }
dogeos-rpc-types = { workspace = true, optional = true }

sbv-helpers.workspace = true

[dev-dependencies]

[features]
# serialization
rkyv = ["dep:rkyv", "alloy-primitives/rkyv"]

# features proxy
c-kzg = ["revm/c-kzg"]

# core features switch
chainspec = ["dep:reth-chainspec", "hardforks"]
evm-types = ["dep:alloy-evm"]
network-types = ["dep:alloy-network"]
hardforks = ["dep:reth-ethereum-forks"]
reth-evm-types = ["dep:reth-evm", "dep:reth-evm-ethereum"]
reth-execution-types = ["dep:reth-execution-types"]
revm-types = ["dep:revm"]
ethereum-all = [
  "chainspec",
  "evm-types",
  "network-types",
  "hardforks",
  "reth-evm-types",
  "reth-execution-types",
  "revm-types",
]

scroll = [
  "dep:dogeos-reth-primitives",
  "dep:dogeos-protocol-types",
  "dep:dogeos-rpc-types",
  "dogeos-protocol-types/serde",
  "dogeos-protocol-types/serde-bincode-compat",
  "dogeos-reth-primitives/serde",
]
scroll-compress-info = [
  "scroll",
  "scroll-evm-types",
  "dep:dogeos-reth-evm",
  "dogeos-reth-evm/std",
  "dogeos-reth-evm/zstd_compression"
]
scroll-chainspec = ["scroll", "chainspec", "dep:dogeos-chainspec", "scroll-hardforks"]
scroll-evm-types = ["evm-types", "dep:dogeos-reth-evm"]
scroll-hardforks = [
  "scroll",
  "hardforks",
  "dep:dogeos-hardforks",
  "dogeos-hardforks/serde",
]
scroll-network-types = ["scroll", "network-types", "dep:dogeos-rpc-types"]
scroll-reth-evm-types = [
  "scroll",
  "reth-evm-types",
  "dep:dogeos-reth-evm",
  "dep:dogeos-rpc-types",
]
scroll-revm-types = [
  "scroll",
  "revm-types",
  "dep:revm-scroll",
  "revm/optional_no_base_fee",
]
scroll-all = [
  "ethereum-all",
  "scroll",
  "scroll-chainspec",
  "scroll-evm-types",
  "scroll-hardforks",
  "scroll-network-types",
  "scroll-reth-evm-types",
  "scroll-revm-types",
]

dev = ["dep:tracing"]

sp1 = []
cycle-tracker = []
