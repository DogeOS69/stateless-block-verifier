[package]
name = "sbv-primitives"
homepage = "https://github.com/scroll-tech/stateless-block-verifier/tree/master/crates/primitives"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
tracing = { workspace = true, optional = true }

alloy-consensus = { workspace = true, features = ["serde", "serde-bincode-compat"] }
alloy-eips.workspace = true
alloy-evm = { workspace = true, optional = true }
alloy-rpc-types-eth.workspace = true
alloy-rpc-types-debug.workspace = true
alloy-serde.workspace = true
alloy-primitives.workspace = true

revm = { workspace = true, optional = true }
revm-scroll = { workspace = true, optional = true }
reth-consensus = { workspace = true, optional = true }
reth-chainspec = { workspace = true, optional = true }
reth-evm = { workspace = true, optional = true }
reth-ethereum-forks = { workspace = true, optional = true }
reth-execution-types = { workspace = true, optional = true }
reth-primitives-traits = { workspace = true, features = ["serde"] }
dogeos-reth-consensus = { workspace = true, optional = true }
dogeos-chainspec = { workspace = true, optional = true }
dogeos-hardforks = { workspace = true, optional = true }
dogeos-protocol-types = { workspace = true, features = ["k256", "reth-compat", "serde", "serde-bincode-compat"] }
dogeos-reth-evm = { workspace = true, optional = true }
dogeos-reth-primitives = { workspace = true, features = ["serde"] }
dogeos-rpc-types = { workspace = true }

sbv-helpers.workspace = true

[dev-dependencies]

[features]
# features proxy
c-kzg = ["revm/c-kzg"]

# Optional capabilities; all exported chain types are Scroll/DogeOS types.
chainspec = ["dep:reth-chainspec", "dep:dogeos-chainspec", "hardforks"]
evm-types = ["dep:alloy-evm", "dep:dogeos-reth-evm"]
network-types = []
hardforks = ["dep:reth-ethereum-forks", "dep:dogeos-hardforks", "dogeos-hardforks/serde"]
# PI-only consumers can use consensus helpers without selecting Scroll execution features.
reth-consensus-types = ["dep:reth-consensus", "dep:dogeos-reth-consensus"]
# Do not enable `dogeos-reth-evm/std` here yet. The zkVM target supports Rust's standard library,
# but `reth-primitives-traits` 0.1.1 folds `quanta` into its `std` feature. `quanta` 0.12.6 treats
# every non-Windows, non-Wasm target (including `target_os = "zkvm"`) as Unix and requires libc's
# `timespec`/`clock_gettime`, which the zkVM target does not provide. See the compatibility
# implementation in `src/types.rs` and upstream reth-core commit 4342fddd67d3c2714f1bc4c4ac6725b1923b9a6d.
reth-evm-types = ["dep:reth-evm", "dep:dogeos-reth-evm", "dep:alloy-evm"]
reth-execution-types = ["dep:reth-execution-types"]
revm-types = ["dep:revm", "dep:revm-scroll", "revm/optional_no_base_fee"]

# Host-only compression support. Keep this out of the core guest feature set.
scroll-compress-info = [
  "evm-types",
  "dogeos-reth-evm/std",
  "dogeos-reth-evm/zstd_compression",
]

# Compatibility entry points for existing Scroll consumers. There is no chain-mode switch.
scroll = []
scroll-chainspec = ["chainspec"]
scroll-evm-types = ["evm-types"]
scroll-hardforks = ["hardforks"]
scroll-network-types = ["network-types"]
scroll-reth-consensus-types = ["reth-consensus-types"]
scroll-reth-evm-types = ["reth-evm-types"]
scroll-revm-types = ["revm-types"]
scroll-all = [
  "chainspec",
  "evm-types",
  "network-types",
  "hardforks",
  "reth-consensus-types",
  "reth-evm-types",
  "reth-execution-types",
  "revm-types",
]

dev = ["dep:tracing"]

sp1 = []
cycle-tracker = []
