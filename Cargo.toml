[workspace]
members = [
    "crates/bin",
    "crates/core",
    "crates/helpers",
    "crates/primitives",
    "crates/sbv",
    "crates/trie",
    "crates/utils",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.90"
authors = ["Scroll developers"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/scroll-tech/stateless-block-verifier"
repository = "https://github.com/scroll-tech/stateless-block-verifier"

[workspace.lints.rust]
missing-docs = "warn"
missing-debug-implementations = "warn"
unused-qualifications = "warn"

[workspace.lints.clippy]
# some useful lints from pedantic group
assigning-clones = "warn"
cast-lossless = "warn"
redundant-else = "warn"
single-match-else = "warn"
elidable-lifetime-names = "warn"
uninlined-format-args = "warn"
unnecessary-box-returns = "warn"
unnecessary-debug-formatting = "warn"
# The Tsuki dependency lane intentionally carries duplicate alloy/revm versions while dogeos-reth
# is pinned to its upstream stack.
multiple-crate-versions = "allow"

[workspace.dependencies]
# https://github.com/alloy-rs/alloy
alloy = { version = "=1.8.2", default-features = false }
alloy-consensus = { version = "=1.8.2", default-features = false }
alloy-eips = { version = "=1.8.2", default-features = false }
alloy-network = { version = "=1.8.2", default-features = false }
alloy-provider = { version = "=1.8.2", default-features = false }
alloy-rpc-client = { version = "=1.8.2", default-features = false }
alloy-rpc-types-eth = { version = "=1.8.2", default-features = false }
alloy-rpc-types-debug = { version = "=1.8.2", default-features = false }
alloy-serde = { version = "=1.8.2", default-features = false }
alloy-transport = { version = "=1.8.2", default-features = false }
# https://github.com/alloy-rs/rlp
alloy-rlp = { version = "0.3.13", default-features = false, features = ["core-net"] }
# https://github.com/alloy-rs/trie
alloy-trie = { version = "0.9.4", default-features = false }
# https://github.com/alloy-rs/core
alloy-primitives = { version = "=1.5.7", default-features = false, features = ["map-hashbrown", "map-fxhash"] }
# https://github.com/alloy-rs/evm
alloy-evm = { version = "=0.30.0", default-features = false }

revm-scroll = { git = "https://github.com/DogeOS69/dogeos-revm.git", branch = "dogeos", default-features = false }

reth-chainspec = { git = "https://github.com/DogeOS69/reth.git", rev = "972366a0bfc11cf6a0d5dc79d5e779cd81e32232", default-features = false }
reth-evm = { git = "https://github.com/DogeOS69/reth.git", rev = "972366a0bfc11cf6a0d5dc79d5e779cd81e32232", default-features = false }
reth-evm-ethereum = { git = "https://github.com/DogeOS69/reth.git", rev = "972366a0bfc11cf6a0d5dc79d5e779cd81e32232", default-features = false }
reth-ethereum-forks = { git = "https://github.com/DogeOS69/reth.git", rev = "972366a0bfc11cf6a0d5dc79d5e779cd81e32232", default-features = false }
reth-execution-types = { git = "https://github.com/DogeOS69/reth.git", rev = "972366a0bfc11cf6a0d5dc79d5e779cd81e32232", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/DogeOS69/reth.git", rev = "972366a0bfc11cf6a0d5dc79d5e779cd81e32232", default-features = false }
reth-primitives-traits = { version = "=0.1.1", default-features = false }
reth-trie = { git = "https://github.com/DogeOS69/reth.git", rev = "972366a0bfc11cf6a0d5dc79d5e779cd81e32232", default-features = false }

dogeos-chainspec = { git = "https://github.com/DogeOS69/dogeos-reth.git", rev = "e2e098bc8a9a9847322564c873184fff43678172", default-features = false }
dogeos-hardforks = { git = "https://github.com/DogeOS69/dogeos-reth.git", rev = "e2e098bc8a9a9847322564c873184fff43678172", default-features = false }
dogeos-protocol-types = { git = "https://github.com/DogeOS69/dogeos-reth.git", rev = "e2e098bc8a9a9847322564c873184fff43678172", default-features = false }
dogeos-reth-evm = { git = "https://github.com/DogeOS69/dogeos-reth.git", rev = "e2e098bc8a9a9847322564c873184fff43678172", default-features = false }
dogeos-reth-primitives = { git = "https://github.com/DogeOS69/dogeos-reth.git", rev = "e2e098bc8a9a9847322564c873184fff43678172", default-features = false }
dogeos-rpc-types = { git = "https://github.com/DogeOS69/dogeos-reth.git", rev = "e2e098bc8a9a9847322564c873184fff43678172", default-features = false }

risc0-ethereum-trie = { git = "https://github.com/risc0/risc0-ethereum" }

#reth-chainspec = { path = "../reth/crates/chainspec", default-features = false }
#reth-evm = { path = "../reth/crates/evm/evm", default-features = false }
