[workspace]
members = [
    "crates/bin",
    "crates/core",
    "crates/helpers",
    "crates/primitives",
    "crates/sbv",
    "crates/trie",
    "crates/utils",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.91"
authors = ["Scroll developers"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/scroll-tech/stateless-block-verifier"
repository = "https://github.com/scroll-tech/stateless-block-verifier"

[workspace.lints.rust]
missing-docs = "warn"
missing-debug-implementations = "warn"
unused-qualifications = "warn"

[workspace.lints.clippy]
# some useful lints from pedantic group
assigning-clones = "warn"
cast-lossless = "warn"
redundant-else = "warn"
single-match-else = "warn"
elidable-lifetime-names = "warn"
uninlined-format-args = "warn"
unnecessary-box-returns = "warn"
unnecessary-debug-formatting = "warn"
# this is useful if we forget to align versions of alloy/revm when upgrading reth
multiple-crate-versions = "warn"

[workspace.dependencies]
# https://github.com/alloy-rs/alloy
alloy = { version = "2.1.0", default-features = false }
alloy-consensus = { version = "2.1.0", default-features = false, features = ["k256"] }
alloy-eips = { version = "2.1.0", default-features = false }
alloy-network = { version = "2.1.0", default-features = false }
alloy-provider = { version = "2.1.0", default-features = false }
alloy-rpc-client = { version = "2.1.0", default-features = false }
alloy-rpc-types-eth = { version = "2.1.0", default-features = false }
alloy-rpc-types-debug = { version = "2.1.0", default-features = false }
alloy-serde = { version = "2.1.0", default-features = false }
alloy-transport = { version = "2.1.0", default-features = false }
# https://github.com/alloy-rs/rlp
alloy-rlp = { version = "0.3.15", default-features = false }
# https://github.com/alloy-rs/trie
alloy-trie = { version = "0.9.5", default-features = false }
# https://github.com/alloy-rs/core
alloy-primitives = { version = "1.6.0", default-features = false, features = ["map-hashbrown", "map-fxhash"] }
# https://github.com/alloy-rs/evm
alloy-evm = { version = "0.37.1", default-features = false }

# Scroll-specific revm extensions. Direct revm comes from crates.io below.
revm-scroll = { git = "https://github.com/DogeOS69/dogeos-revm", rev = "862a17dae1255b542f92ae006cf3e7c24cc418e2", default-features = false }

# DogeOS Reth migration head: https://github.com/DogeOS69/dogeos-reth/pull/8
reth-chainspec = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }
reth-evm = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }
reth-evm-ethereum = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }
reth-ethereum-forks = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }
reth-execution-types = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }
reth-primitives = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }
reth-primitives-traits = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }
reth-stateless = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }
reth-trie = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }

reth-scroll-chainspec = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }
reth-scroll-evm = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }
reth-scroll-forks = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }
reth-scroll-primitives = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }

scroll-alloy-evm = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }
scroll-alloy-consensus = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false, features = ["k256"] }
scroll-alloy-rpc-types = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }
scroll-alloy-network = { git = "https://github.com/DogeOS69/dogeos-reth", rev = "964ef6eb6ae73f1ae3206eb0c6f69dfebec948c0", default-features = false }

risc0-ethereum-trie = { git = "https://github.com/risc0/risc0-ethereum" }

# Local path equivalents for cross-repo integration.
#reth-chainspec = { path = "../dogeos-reth/crates/chainspec", default-features = false }
#reth-evm = { path = "../dogeos-reth/crates/evm/evm", default-features = false }
#reth-evm-ethereum = { path = "../dogeos-reth/crates/ethereum/evm", default-features = false }
#reth-ethereum-forks = { path = "../dogeos-reth/crates/ethereum/hardforks", default-features = false }
#reth-execution-types = { path = "../dogeos-reth/crates/evm/execution-types", default-features = false }
#reth-primitives = { path = "../dogeos-reth/crates/primitives", default-features = false }
#reth-primitives-traits = { path = "../dogeos-reth/crates/primitives-traits", default-features = false }
#reth-stateless = { path = "../dogeos-reth/crates/stateless", default-features = false }
#reth-trie = { path = "../dogeos-reth/crates/trie/trie", default-features = false }
#
#reth-scroll-chainspec = { path = "../dogeos-reth/crates/scroll/chainspec", default-features = false }
#reth-scroll-evm = { path = "../dogeos-reth/crates/scroll/evm", default-features = false }
#reth-scroll-forks = { path = "../dogeos-reth/crates/scroll/hardforks", default-features = false }
#reth-scroll-primitives = { path = "../dogeos-reth/crates/scroll/primitives", default-features = false }
#
#scroll-alloy-evm = { path = "../dogeos-reth/crates/scroll/alloy/evm", default-features = false }
#scroll-alloy-consensus = { path = "../dogeos-reth/crates/scroll/alloy/consensus", default-features = false }
#scroll-alloy-rpc-types = { path = "../dogeos-reth/crates/scroll/alloy/rpc-types", default-features = false }
#scroll-alloy-network = { path = "../dogeos-reth/crates/scroll/alloy/network", default-features = false }

async-trait = "0.1"
auto_impl = "1.3"
console = "0.16"
futures = "0.3"
indicatif = "0.18"
itertools = "0.14"
rkyv = "0.8"
thiserror = "2.0"
url = ">=2.5.3"
rstest = "0.26"
eyre = "0.6"
clap = "4"
serde = "1.0"
serde_json = "1.0"
serde_path_to_error = "0.1"
serde_with = "3.16"
tokio = { version = "1", default-features = false }
csv = "1.3"
ctor = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# workspace
sbv = { path = "crates/sbv" }
sbv-core = { path = "crates/core" }
sbv-primitives = { path = "crates/primitives" }
sbv-trie = { path = "crates/trie" }
sbv-helpers = { path = "crates/helpers" }
sbv-utils = { path = "crates/utils" }

[workspace.dependencies.revm]
version = "41.0.0"
default-features = false
features = ["std"]

[profile.release]
lto = true
codegen-units = 1
