name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
  push:
    branches:
      - master
      - dogeos/main
      - feat/tsuki-hardfork

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: git

jobs:
  skip_check:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          cancel_others: 'true'
          concurrent_skipping: 'same_content_newer'
          paths_ignore: '["**/README.md"]'

  fmt:
    needs: [ skip_check ]
    if: |
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        (github.event.action == 'ready_for_review' || needs.skip_check.outputs.should_skip != 'true')
      )
    name: Rustfmt
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly"
          components: rustfmt
      - name: Cargo fmt
        run: cargo +nightly fmt --all -- --check

  clippy:
    needs: [ fmt, skip_check ]
    if: |
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        (github.event.action == 'ready_for_review' || needs.skip_check.outputs.should_skip != 'true')
      )
    name: Clippy
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: clippy
      - name: cargo cache
        uses: Swatinem/rust-cache@v2
      - name: check sbv-core guest dependencies in isolation
        run: cargo check -p sbv-core --no-default-features --locked
      - name: check consensus-only compatibility feature in isolation
        run: cargo check -p sbv-primitives --no-default-features --features scroll-reth-consensus-types --locked
      - name: clippy default
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy all
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    needs: [ clippy, skip_check ]
    if: |
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        (github.event.action == 'ready_for_review' || needs.skip_check.outputs.should_skip != 'true')
      )
    name: Test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - name: cargo cache
        uses: Swatinem/rust-cache@v2
      - name: cargo test default Scroll mode
        run: cargo test --workspace --locked
      - name: cargo test sbv-core under the guest feature set
        run: cargo test -p sbv-core --no-default-features --locked
      - name: cargo test all features and compatibility aliases
        run: cargo test --workspace --all-features --locked
